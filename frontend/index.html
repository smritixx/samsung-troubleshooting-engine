<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Samsung Smart Guided Troubleshooting</title>
<style>
  :root{
    --bg:#0b1020; --card:#131a33; --muted:#8ea0c7; --accent:#3d7bff;
    --good:#22c55e; --bad:#ef4444; --warn:#f59e0b; --text:#e9eefb;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       background:linear-gradient(180deg,#070b18,#0b1020 40%);color:var(--text);
       min-height:100vh;padding:32px 16px;}
  .wrap{max-width:980px;margin:0 auto;}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:var(--muted);margin-bottom:24px}
  .panel{background:var(--card);border:1px solid #1e2950;border-radius:14px;
         padding:18px;margin-bottom:18px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  textarea,input{width:100%;background:#0c1striped;background:#0c1226;color:var(--text);
                 border:1px solid #243060;border-radius:10px;padding:12px;font-size:14px;
                 font-family:inherit;resize:vertical;}
  textarea:focus,input:focus{outline:none;border-color:var(--accent)}
  button{margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:10px;
         padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{background:#0c1226;border:1px solid #243060;color:var(--muted);
        border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer}
  .chip:hover{color:var(--text);border-color:var(--accent)}
  .meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px}
  .meta span{background:#0c1226;border:1px solid #1f2a52;padding:4px 10px;border-radius:999px}
  .action{background:#0c1226;border:1px solid #1f2a52;border-radius:12px;
          padding:14px;margin:12px 0}
  .action h3{margin:0 0 6px;font-size:16px}
  .badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;margin-left:8px}
  .badge.auto{background:rgba(34,197,94,.15);color:var(--good)}
  .badge.manual{background:rgba(245,158,11,.15);color:var(--warn)}
  .badge.critical{background:rgba(239,68,68,.15);color:var(--bad)}
  ol{margin:8px 0 0 18px;padding:0}
  li{margin:6px 0;line-height:1.5;font-size:14px}
  .deeplink{margin-top:10px;background:#0f1730;border:1px dashed #2b3d7a;
            border-radius:10px;padding:10px 12px;font-size:13px}
  .deeplink code{color:#8bb4ff;word-break:break-all}
  .error{color:var(--bad);font-size:13px;margin-top:8px}
  pre{background:#0a1024;border:1px solid #1f2a52;border-radius:10px;
      padding:12px;overflow:auto;font-size:12px;color:#b9c7ea}
</style>
</head>
<body>
<div class="wrap">
  <h1>Smart Guided Troubleshooting Engine</h1>
  <div class="sub">Describe your Galaxy-device problem in plain language.</div>

  <div class="panel">
    <textarea id="query" rows="3" placeholder="e.g. My Galaxy S24 Ultra screen is completely black and won't turn on, even though the phone powers on and rings."></textarea>
    <div class="chips" id="examples"></div>
    <button id="run">Get troubleshooting plan</button>
    <div class="error" id="err"></div>
  </div>

  <div id="out"></div>
</div>

<script>
const EXAMPLES = [
  "My Galaxy S24 Ultra screen is completely black and won't turn on, even though the phone powers on and rings, and there is no physical damage.",
  "My Galaxy phone's screen is completely cracked, it's a total crack and I can't use the device.",
  "My Galaxy S22 screen inputs are delayed and the touch responsiveness is laggy.",
  "My new Samsung phone's main screen stays small and doesn't fill the whole display.",
  "My Galaxy S24 screen goes completely blank and I can't use Smart Switch to transfer data.",
];

const $ = (s) => document.querySelector(s);
const q = $("#query");
const out = $("#out");
const err = $("#err");
const btn = $("#run");

const exWrap = $("#examples");
EXAMPLES.forEach(t => {
  const c = document.createElement("div");
  c.className = "chip";
  c.textContent = t.length > 70 ? t.slice(0,70)+"…" : t;
  c.title = t;
  c.onclick = () => { q.value = t; };
  exWrap.appendChild(c);
});

btn.onclick = async () => {
  err.textContent = "";
  out.innerHTML = "";
  const query = q.value.trim();
  if (!query) { err.textContent = "Please enter a complaint."; return; }
  btn.disabled = true;
  try {
    const res = await fetch("/v1/troubleshoot", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({query, sis_response: ""}),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    render(data);
  } catch (e) {
    err.textContent = e.message;
  } finally {
    btn.disabled = false;
  }
};

function render(data) {
  const m = data.meta || {};
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `
    <span>latency: ${m.latency_ms ?? "?"} ms</span>
    <span>cache_hit: ${!!m.cache_hit}</span>
    <span>siis_score: ${m.siis_match_score ?? "-"}</span>
    <span>schema_valid: ${m.schema_valid === undefined ? "-" : m.schema_valid}</span>
    <span>validation_errors: ${(m.validation_errors||[]).length}</span>
  `;
  if (m.approximate) {
  const banner = document.createElement("div");
  banner.style.cssText =
    "margin-top:12px;padding:10px 14px;border-radius:10px;" +
    "background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);" +
    "color:#f59e0b;font-size:13px";
  banner.textContent = "Approximate match — this plan is the closest " +
    "we have in our knowledge base, but it may not solve your exact issue.";
  out.appendChild(banner);
}

  const ctxs = (data.response && data.response.contexts) || [];
  if (ctxs.length === 0) {
  const p = document.createElement("div");
  p.className = "panel";
  let html = "<b>No matching plan found.</b><br/>" +
    "<span style=\"color:var(--muted)\">" +
    (m.fallback_message || "The engine abstained because trusted evidence was insufficient.") +
    "</span>";
  const topics = m.suggested_topics || [];
  if (topics.length) {
    html += "<div style=\"margin-top:14px;font-size:13px\">" +
      "<div style=\"color:var(--muted);margin-bottom:6px\">Topics we do cover:</div>";
    topics.forEach(t => {
      html += "<div style=\"padding:4px 0\">• " + escapeHtml(t) + "</div>";
    });
    html += "</div>";
  }
  p.innerHTML = html;
  out.appendChild(meta);
  out.appendChild(p);
  return;
}

  const ctx = ctxs[0];
  const panel = document.createElement("div");
  panel.className = "panel";
  panel.innerHTML = `<h2 style="margin:0 0 4px;font-size:18px">${escapeHtml(ctx.title)}</h2>
                     <div style="color:var(--muted);font-size:13px">${escapeHtml(ctx.goal)}</div>`;

  ctx.actions.forEach(a => {
    const aDiv = document.createElement("div");
    aDiv.className = "action";
    const cat = a.category || "manual";
    aDiv.innerHTML = `<h3>${escapeHtml(a.actionName)}
        <span class="badge ${cat}">${cat}</span></h3>
      <div style="color:var(--muted);font-size:13px">${escapeHtml(a.description||"")}</div>`;
    let stepNum = 0;

    (a.stepGroups||[]).forEach(sg => {
      const steps = sg.steps || [];
      steps.forEach((s, idx) => {
        stepNum++;
        const row = document.createElement("div");
        row.style.cssText = "margin:8px 0;font-size:14px;line-height:1.5";
        const numSpan = document.createElement("span");
        numSpan.style.cssText =
          "color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums";
        numSpan.textContent = stepNum + ".";
        const textSpan = document.createElement("span");
        textSpan.textContent = s;
        row.appendChild(numSpan);
        row.appendChild(textSpan);
        aDiv.appendChild(row);

        if (idx === steps.length - 1 && sg.actionableDeeplink) {
          const dl = document.createElement("div");
          dl.className = "deeplink";
          dl.innerHTML = `<b>One-tap action</b> — ${escapeHtml(sg.actionableDeeplink.description||"")}<br/>
          <code>${escapeHtml(sg.actionableDeeplink.deeplink)}</code>`;
          aDiv.appendChild(dl);
        }
      });
    });

    panel.appendChild(aDiv);
  });

  out.appendChild(meta);
  out.appendChild(panel);

  const raw = document.createElement("details");
  raw.innerHTML = `<summary style="cursor:pointer;color:var(--muted);margin-top:8px">Raw JSON</summary>
                   <pre>${escapeHtml(JSON.stringify(data, null, 2))}</pre>`;
  out.appendChild(raw);
}

function escapeHtml(s){return String(s||"").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
</script>
</body>
</html>
